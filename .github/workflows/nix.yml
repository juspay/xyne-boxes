name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake (unit tests + typecheck + package eval)
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build .#default --print-build-logs

      - name: Test built CLI
        run: |
          set -euo pipefail
          nix run . -- version
          nix run . -- help
          nix shell .#default -c bash -euo pipefail -c 'command -v xyne-boxes; command -v pu; xyne-boxes version; pu version'
          if nix run . -- create; then
            echo "create with no name should fail" >&2
            exit 1
          fi

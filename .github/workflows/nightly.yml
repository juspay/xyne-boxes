name: Nightly

on:
  push:
    branches:
      - main
      - ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: xyne-boxes-darwin-arm64
          - os: macos-13
            asset: xyne-boxes-darwin-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and typecheck
        run: |
          bun test ./packages/client
          bunx tsc --noEmit -p packages/client

      - name: Compile
        run: bun build --compile --outfile "${{ matrix.asset }}" packages/client/src/cli.ts

      - name: Smoke the binary
        run: |
          chmod +x "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
          "./${{ matrix.asset }}" help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish nightly tag
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          chmod +x xyne-boxes-*
          sha256sum xyne-boxes-* | tee SHA256SUMS
          ls -lh

      - name: Recreate the Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin refs/tags/nightly
          gh release create nightly \
            --prerelease \
            --title "Nightly" \
            --target "${GITHUB_SHA}" \
            --notes "Moving nightly from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`).

          macOS only. Needs \`ssh\` (system) and \`step\` on PATH.

          Assets:
          - \`xyne-boxes-darwin-arm64\`
          - \`xyne-boxes-darwin-x64\`
          - \`SHA256SUMS\`" \
            dist/xyne-boxes-darwin-arm64 \
            dist/xyne-boxes-darwin-x64 \
            dist/SHA256SUMS

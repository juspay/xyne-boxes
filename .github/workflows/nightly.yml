name: Nightly

on:
  push:
    branches:
      - main
      - ts
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep pull_request checks from cancelling the push that publishes `nightly`.
  group: nightly-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: xyne-boxes-darwin-arm64
          - os: ubuntu-latest
            asset: xyne-boxes-linux-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and typecheck
        run: |
          bun test ./packages/client ./packages/cli
          bunx tsc --noEmit -p packages/client
          bunx tsc --noEmit -p packages/cli
          sh installer/test/install.test.sh

      - name: Stamp commit into the binary
        run: printf 'export const BAKED_COMMIT = "%s"\n' "${GITHUB_SHA}" > packages/cli/src/commit.ts

      - name: Compile
        run: bun build --compile --outfile "${{ matrix.asset }}" packages/cli/src/cli.ts

      - name: Smoke the binary
        run: |
          chmod +x "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
          "./${{ matrix.asset }}" version | grep -F "${GITHUB_SHA}"
          "./${{ matrix.asset }}" help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  install-e2e:
    name: Curl-install on ${{ matrix.os }}
    needs: compile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            boxes: xyne-boxes-darwin-arm64
          - os: ubuntu-latest
            boxes: xyne-boxes-linux-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download compiled CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.boxes }}
          path: dist

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Curl-install
        run: sh installer/test/curl-install.sh dist

  publish:
    name: Publish nightly tag
    needs: [compile, install-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download compiled CLIs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Assemble release
        run: |
          sh installer/assemble-release.sh dist
          ls -lh dist

      - name: Recreate the Nightly prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nightly
          NOTES="Moving \`nightly\` from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`).

          Pristine macOS (Apple Silicon) and Linux x86_64:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/juspay/xyne-boxes/nightly/installer/install.sh | sh
          \`\`\`

          \`xyne-boxes version\` prints this commit. The installer also drops official \`step\` (no preinstall). System \`ssh\` is still required."
          git tag -f "$TAG" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${TAG}"
          assets="dist/xyne-boxes-darwin-arm64 dist/xyne-boxes-linux-x64 dist/step-darwin-arm64 dist/step-linux-x64 dist/install.sh dist/COMMIT dist/SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Do not delete-then-recreate: a cancelled run would 404 the curl | sh URL.
            gh release upload "$TAG" $assets --clobber
            gh release edit "$TAG" --prerelease --title "Nightly (${GITHUB_REF_NAME})" --notes "$NOTES"
          else
            gh release create "$TAG" \
              --prerelease \
              --title "Nightly (${GITHUB_REF_NAME})" \
              --target "${GITHUB_SHA}" \
              --notes "$NOTES" \
              $assets
          fi

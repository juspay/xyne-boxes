name: Nightly

on:
  push:
    branches:
      - main
      - ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: xyne-boxes-darwin-arm64
          - os: ubuntu-latest
            asset: xyne-boxes-linux-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and typecheck
        run: |
          bun test ./packages/client
          bunx tsc --noEmit -p packages/client

      - name: Stamp commit into the binary
        run: printf 'export const BAKED_COMMIT = "%s"\n' "${GITHUB_SHA}" > packages/client/src/commit.ts

      - name: Compile
        run: bun build --compile --outfile "${{ matrix.asset }}" packages/client/src/cli.ts

      - name: Smoke the binary
        run: |
          chmod +x "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
          "./${{ matrix.asset }}" version | grep -F "${GITHUB_SHA}"
          "./${{ matrix.asset }}" help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish nightly tag
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download compiled CLIs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fetch official step binaries
        run: |
          chmod +x installer/fetch-step.sh
          installer/fetch-step.sh darwin-arm64 dist/step-darwin-arm64
          installer/fetch-step.sh linux-x64 dist/step-linux-x64
          printf '%s\n' "${GITHUB_SHA}" > dist/COMMIT
          sed "s/__XYNE_COMMIT__/${GITHUB_SHA}/g" installer/install.sh > dist/install.sh
          chmod +x dist/xyne-boxes-* dist/step-* dist/install.sh

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum xyne-boxes-* step-* install.sh COMMIT | tee SHA256SUMS
          ls -lh

      - name: Recreate the Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin refs/tags/nightly
          gh release create nightly \
            --prerelease \
            --title "Nightly" \
            --target "${GITHUB_SHA}" \
            --notes "Moving nightly from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`).

          Pristine macOS (Apple Silicon) and Linux x86_64:

          \`\`\`
          curl -fsSL https://github.com/juspay/xyne-boxes/releases/download/nightly/install.sh | sh
          \`\`\`

          \`xyne-boxes version\` prints this commit. The installer also drops official \`step\` (no preinstall). System \`ssh\` is still required." \
            dist/xyne-boxes-darwin-arm64 \
            dist/xyne-boxes-linux-x64 \
            dist/step-darwin-arm64 \
            dist/step-linux-x64 \
            dist/install.sh \
            dist/COMMIT \
            dist/SHA256SUMS
